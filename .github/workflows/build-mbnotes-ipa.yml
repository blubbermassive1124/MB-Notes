
name: Build MB Notes unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPad app
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout MB Notes source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA using upstream script
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/mbnotes-build" "$RUNNER_TEMP/mbnotes-artifacts"
          export GALA_BUILD_DIR="$RUNNER_TEMP/mbnotes-build"
          export GALA_ARTIFACT_DIR="$RUNNER_TEMP/mbnotes-artifacts"
          bash ./ios-build.sh
          test -s "$GALA_ARTIFACT_DIR/MBNotes.ipa"
          unzip -tqq "$GALA_ARTIFACT_DIR/MBNotes.ipa"
          shasum -a 256 "$GALA_ARTIFACT_DIR/MBNotes.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MBNotes-unsigned-IPA
          path: ${{ runner.temp }}/mbnotes-artifacts/MBNotes.ipa
          if-no-files-found: error
          retention-days: 7
